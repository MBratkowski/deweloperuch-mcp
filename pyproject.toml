[project]
name = "deweloperuch-mcp"
version = "0.1.0"
description = "MCP server and CLI over deweloperuch.pl data (developer offer prices, RCN transactions, market statistics)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# recon/ scripts are not part of the package; tests import them as top-level modules
# (probe, flight, allowlist, config), the way `python3 recon/<script>.py` does.
pythonpath = ["recon"]
# pytest-socket: no test may open a network socket (CLAUDE.md, D10).
addopts = "--disable-socket"

[tool.ruff]
line-length = 100
target-version = "py311"
# recon/ modules (config, flight, allowlist, probe) are first-party for import sorting.
src = [".", "src", "recon"]
extend-exclude = [
    # Markdown (ruff formats its code blocks by default) belongs to the documentation
    # owners; its snippets are illustrative, not project code.
    "*.md",
    # Claude Code hooks: tooling of the main thread, not project code.
    ".claude/",
    # Pre-existing recon scripts kept byte-for-byte until their own tasks.
    # Remove each entry when its task reworks the file.
    "recon/scan_bundles.py",  # A#3: throttling, cache, baseline
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
# Resolves the recon modules tests import, so `mypy tests` type-checks them too.
mypy_path = "recon"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
