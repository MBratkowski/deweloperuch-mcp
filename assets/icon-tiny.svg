<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-labelledby="title">
  <title id="title">deweloperuch-mcp</title>
  <!-- 16 px variant of icon.svg: one-pixel lines on the pixel grid, head, hard hat, eyes
       and grin only (the MCP badge does not fit at this size). -->
  <rect width="16" height="16" rx="3" fill="#ffffff"/>

  <g fill="#ffffff" stroke="#111111" stroke-width="1">
    <!-- Head -->
    <circle cx="8" cy="9" r="5.5"/>
    <!-- Hard hat: dome and brim -->
    <path d="M3.5 7.5 C3.5 4.5 5.5 2.5 8 2.5 C10.5 2.5 12.5 4.5 12.5 7.5 Z"/>
    <path d="M1 7.5 H15"/>
  </g>

  <!-- Eyes and grin -->
  <path fill="#111111" d="M5 9h1v1h-1z M10 9h1v1h-1z M5 11h6v1h-1v1h-4v-1h-1z"/>
</svg>
