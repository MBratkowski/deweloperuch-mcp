# Quality gates and offline tests on every push to main and every pull request.
# Nothing here sends a request to deweloperuch.pl: the tests run with sockets disabled
# (pytest-socket) and the live suite (tests/e2e) is never run in CI (D10).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
      DEWELOPERUCH_LIVE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Lint, format, types, import contracts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: make fast
      - name: Offline tests (never the live suite)
        run: uv run pytest -q
      - name: Offline CLI and MCP startup
        run: |
          uv run deweloperuch --help
          uv run python packaging/smoke.py -- uv run deweloperuch-mcp

  package:
    # Builds the wheel, the sdist and the .mcpb and starts them over stdio
    # (initialize + tools/list only: no tool call, so no request to the service).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: make package
      - run: make smoke
