# On a version tag (v0.1.0, ...): builds the wheel, the sdist and the Claude Desktop
# extension (.mcpb), starts them over stdio (no tool call, no request to the service)
# and attaches them to a GitHub Release. Bump the version in pyproject.toml and
# packaging/mcpb/manifest.json before tagging; the tag must match it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Check that the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - name: Build the wheel, the sdist and the .mcpb
        run: make package
      - name: Start the built server as an MCP client does
        run: make smoke
      - name: Create the GitHub Release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/*.mcpb \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      # PyPI publishing is off. To turn it on: create the project on PyPI, add a trusted
      # publisher there (owner MBratkowski, repository deweloperuch-mcp, workflow
      # release.yml, environment pypi), add `environment: pypi` and
      # `permissions: { id-token: write, contents: write }` to this job, then uncomment:
      #
      # - name: Publish to PyPI (trusted publishing, no token)
      #   run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
